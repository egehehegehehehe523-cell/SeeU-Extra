plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = 'dev.keryeshka.worldbosses'
version = project.mod_version
base { archivesName = 'world-bosses-neoforge-1.21.1' }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(project.java_version as int) }
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = project.java_version as int
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
}

// These declarations are only the public API *signatures* of SeeU Extra 0.3.0.
// They compile into a separate source set and are deliberately excluded from
// the World Bosses mod JAR and its runtime classpath. SeeU Extra is still
// required as a separate installed mod at runtime.
sourceSets {
    seeuApi
}
dependencies {
    compileOnly sourceSets.seeuApi.output
}

neoForge {
    version = project.neo_version
    // Resolve Minecraft/NeoForge types for the isolated API signature source set.
    addModdingDependenciesTo sourceSets.seeuApi
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        configureEach { systemProperty 'neoforge.enabledGameTestNamespaces', 'world_bosses' }
    }
    mods {
        world_bosses { sourceSet(sourceSets.main) }
    }
}

tasks.named('processResources', ProcessResources) {
    inputs.property('mod_version', project.mod_version)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(mod_version: project.mod_version)
    }
}
tasks.named('jar', Jar) {
    from(rootProject.file('LICENSE')) { into 'META-INF' }
}

// Assert at build time that compile-time API signatures never leak into the
// installable JAR. The actual SeeU Extra classes must come from its own mod.
tasks.register('verifyNoSeeUClasses') {
    dependsOn tasks.named('jar')
    doLast {
        def builtJar = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def embedded = zipTree(builtJar).matching {
            include 'dev/keryeshka/seeu/extra/**'
        }.files
        if (!embedded.isEmpty()) {
            throw new GradleException("World Bosses must not package SeeU Extra classes: ${embedded}")
        }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyNoSeeUClasses') }
