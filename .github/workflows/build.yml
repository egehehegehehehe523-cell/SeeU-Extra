name: World Bosses build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build World Bosses standalone JAR
        run: chmod +x gradlew && ./gradlew --no-daemon clean build
      - uses: actions/upload-artifact@v4
        with:
          name: world-bosses-neoforge
          path: build/libs/world-bosses-neoforge-*.jar
